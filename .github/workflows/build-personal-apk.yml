name: Build personal APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-personal:
    name: Build installable personal APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=$(sed -n 's/.*androidNdkVersion *= *"\([0-9.]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$ndk_version"
          sdkmanager_bin=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          "$sdkmanager_bin" --install "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Build OSS personal APK
        shell: bash
        env:
          PERSONAL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          ( cd rust/office-oxide-bridge && cargo --version )
          sed -i -e '/jogamp/d' -e '/https.jitpack/d' settings.gradle.kts
          ./gradlew :app:assembleOssPersonal --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g -PpersonalBuildNumber="$PERSONAL_BUILD_NUMBER"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Episteme-oss-personal
          path: app/build/outputs/renamed-apk/ossPersonal/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="personal-b$PERSONAL_BUILD_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" -y
          fi
          notes=$(awk '/^## \[/{section++} section == 1' CHANGELOG.md)
          test -n "$notes"
          gh release create "$tag" \
            --title "Personal build $PERSONAL_BUILD_NUMBER" \
            --notes "$notes" \
            --latest \
            app/build/outputs/renamed-apk/ossPersonal/*.apk
